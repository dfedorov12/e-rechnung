<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring | E-Rechnung Konverter | DIHAG</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=cfe01454ab">
  <style>
    .mon-header { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
    .mon-header h2 { margin:0; }
    .mon-header p { margin:4px 0 0; color:var(--gray-500); font-size:13px; }

    .mon-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
    .mon-tile { background:#fff; border:1px solid var(--gray-200); border-left:4px solid var(--primary);
                border-radius:var(--border-radius); padding:14px 16px; box-shadow:var(--shadow-sm);
                cursor:pointer; user-select:none; transition:transform .12s ease, box-shadow .12s ease; }
    .mon-tile:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.09); }
    .mon-tile:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
    .mon-tile.active { outline:2px solid var(--primary); outline-offset:1px; box-shadow:0 6px 16px rgba(0,0,0,.10); }
    .mon-tile.active .mon-tile-label { color:var(--gray-800); font-weight:600; }
    .mon-tile-val { font-size:24px; font-weight:700; color:var(--gray-900); line-height:1.1; }
    .mon-tile-label { font-size:12px; color:var(--gray-500); margin-top:4px; }
    .mon-tile.in   { border-left-color:#2563eb; }
    .mon-tile.out  { border-left-color:#0e9f6e; }
    .mon-tile.warn { border-left-color:var(--warning); }
    .mon-tile.bad  { border-left-color:var(--danger); }
    .mon-tile.sum  { border-left-color:#7c3aed; }
    .mon-tile.klass { border-left-color:#0891b2; }

    .mon-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px; }
    .mon-search { position:relative; flex:1 1 240px; min-width:210px; }
    .mon-search::before { content:'🔍'; position:absolute; left:11px; top:50%; transform:translateY(-50%);
                font-size:13px; opacity:.55; pointer-events:none; }
    .mon-search input { width:100%; height:38px; padding:0 12px 0 32px; border:1px solid var(--gray-300);
                border-radius:8px; font-size:13px; background:#fff; }
    .mon-filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .mon-filters select, .mon-filters input[type=date] { height:38px; padding:0 10px; border:1px solid var(--gray-300);
                border-radius:8px; font-size:13px; background:#fff; color:var(--gray-700); cursor:pointer; max-width:190px; }
    .mon-filters select:focus, .mon-filters input[type=date]:focus, .mon-search input:focus {
                outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(23,80,158,.12); }
    .mon-reset { height:38px; padding:0 14px; border:1px solid var(--gray-300); background:var(--gray-50);
                border-radius:8px; font-size:13px; color:var(--gray-600); cursor:pointer; white-space:nowrap; }
    .mon-reset:hover { background:var(--gray-100); color:var(--gray-800); }
    .mon-count { margin-left:auto; font-size:12px; color:var(--gray-500); white-space:nowrap; }

    .mon-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .mon-chips:empty { display:none; }
    .mon-chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
                background:var(--primary-light,#e8f0fb); color:var(--primary-dark,#0f3a6e);
                border-radius:999px; padding:4px 5px 4px 11px; }
    .mon-chip button { border:none; background:rgba(0,0,0,.10); color:inherit; width:17px; height:17px;
                border-radius:50%; cursor:pointer; font-size:10px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0; }
    .mon-chip button:hover { background:rgba(0,0,0,.22); }

    .mon-tabelle { position:relative; }
    .mon-scroll-oben { overflow-x:auto; overflow-y:hidden; height:16px; margin:0 0 3px; flex:none; }
    .mon-scroll-oben > div { height:1px; }
    .mon-scroll-oben[hidden] { display:none; }
    .mon-griff { position:absolute; top:0; right:-4px; width:9px; height:100%; cursor:col-resize; z-index:4; touch-action:none; }
    .mon-griff::after { content:''; position:absolute; top:25%; bottom:25%; left:4px; width:1px; background:var(--gray-300); }
    th:hover .mon-griff::after, .mon-griff:hover::after { background:var(--primary); width:2px; left:3px; }
    body.mon-zieht, body.mon-zieht * { cursor:col-resize !important; user-select:none !important; }
    table.mon-table th.mon-fueller, table.mon-table td.mon-fueller { padding:0 !important; }
    .mon-ansicht [hidden] { display:none; }
    .mon-table-wrap { overflow:auto; max-height:calc(100vh - 150px); min-height:240px; background:#fff;
                border:1px solid var(--gray-200); border-radius:var(--border-radius); box-shadow:var(--shadow-sm);
                scrollbar-gutter:stable; }
    table.mon-table { width:100%; border-collapse:collapse; font-size:13px; min-width:1040px; table-layout:fixed; }
    table.mon-table th { text-align:left; padding:11px 12px; background:var(--gray-50); color:var(--gray-600);
                font-weight:600; border-bottom:1px solid var(--gray-200); white-space:nowrap; position:sticky; top:0; z-index:2;
                box-shadow:0 1px 0 var(--gray-200); }
    table.mon-table th[data-sort] { cursor:pointer; user-select:none; }
    table.mon-table th[data-sort]:hover { background:var(--gray-100); color:var(--gray-800); }
    table.mon-table th .sort-ind { display:inline-block; width:10px; font-size:10px; margin-left:2px; color:var(--primary); }
    table.mon-table td { padding:10px 12px; border-bottom:1px solid var(--gray-100); vertical-align:top; word-break:break-word; overflow-wrap:anywhere; }
    table.mon-table tbody td { background:#fff; }
    table.mon-table tbody tr.z td { background:#fafbfc; }
    table.mon-table tbody tr.mon-zeile { cursor:pointer; }
    table.mon-table tbody tr.mon-zeile:hover td, table.mon-table tbody tr.mon-zeile.offen td { background:#eef4fc; }
    table.mon-table tbody tr.mon-zeile:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
    /* erste Spalte bleibt beim waagerechten Scrollen stehen */
    table.mon-table thead th:first-child { left:0; z-index:3; }
    table.mon-table tbody tr.mon-zeile td:first-child { position:sticky; left:0; z-index:1; box-shadow:1px 0 0 var(--gray-200); }
    .mon-auf { display:inline-block; width:0; height:0; margin:0 7px 1px 0; border-style:solid; border-width:4px 0 4px 6px;
                border-color:transparent transparent transparent var(--gray-400); transition:transform .15s; vertical-align:middle; }
    tr.mon-zeile.offen .mon-auf { transform:rotate(90deg); border-left-color:var(--primary); }
    /* Zeilendichte */
    /* Kompakt: eine Zeile je Rechnung soweit möglich, Abzeichen nebeneinander, Hinweis einzeilig */
    .dichte-kompakt table.mon-table td { padding:4px 8px; font-size:12px; line-height:1.35; }
    .dichte-kompakt table.mon-table th { padding:7px 8px; font-size:12px; }
    .dichte-kompakt table.mon-table tr.mon-zeile td > div { display:inline-block; margin:0 4px 0 0; vertical-align:middle; }
    .dichte-kompakt table.mon-table tr.mon-zeile td > .mon-hint { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; margin-top:1px; }
    .dichte-kompakt .pill, .dichte-kompakt .bh-pill, .dichte-kompakt .mon-datei, .dichte-kompakt .mon-mail { font-size:10.5px; }
    .dichte-kompakt .bh-btn { display:inline-block; padding:2px 7px; margin:0 4px 0 0; }
    .dichte-kompakt .mon-datei { margin-bottom:0; }
    /* Groß: viel Luft, größere Schrift, gut lesbar am großen Bildschirm */
    .dichte-gross table.mon-table td { padding:16px 16px; font-size:15px; line-height:1.55; }
    .dichte-gross table.mon-table th { padding:15px 16px; font-size:14px; }
    .dichte-gross .pill, .dichte-gross .bh-pill, .dichte-gross .mon-datei, .dichte-gross .mon-mail { font-size:12.5px; padding:3px 9px; }
    .dichte-gross .bh-btn { display:inline-block; font-size:12.5px; padding:4px 10px; margin:0 6px 6px 0; }
    /* Details einer Zeile */
    table.mon-table tr.mon-detail td { background:#f6f9fd; padding:14px 18px 16px; border-bottom:1px solid var(--gray-200);
                cursor:default; box-shadow:inset 3px 0 0 var(--primary); }
    .mon-det { position:sticky; left:18px; width:min(100%, calc(var(--mon-wrap-breite, 1100px) - 40px));
                display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px 26px; }
    .mon-det section h4 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--gray-500); }
    .mon-det dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:13px; }
    .mon-det dt { color:var(--gray-500); white-space:nowrap; }
    .mon-det dd { margin:0; color:var(--gray-900); white-space:pre-line; overflow-wrap:anywhere; }
    .mon-det-aktionen { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .mon-det-aktionen .bh-btn { display:inline-block; margin:0; }
    .mon-det-klein { margin:6px 0 0; font-size:12px; color:var(--gray-500); }
    .mon-dupe { display:inline-block; margin-top:2px; font-size:11px; font-weight:600; color:#fff; background:#b40000;
                border-radius:3px; padding:1px 6px; white-space:nowrap; }
    .mon-ok { color:#0a6b2e; font-weight:700; }
    .mon-ver { grid-column:1 / -1; }
    .mon-ver .mon-reset { height:30px; font-size:12px; }
    .mon-ver-liste { margin-top:8px; }
    .mon-ver-rollen { display:flex; flex-direction:column; gap:4px; max-height:340px; overflow-y:auto;
                padding:2px 6px 2px 0; margin-top:4px; scrollbar-gutter:stable; }
    .mon-ver-v { border:1px solid var(--gray-200); border-radius:6px; background:#fff; padding:6px 10px; font-size:13px; }
    .mon-ver-v summary { cursor:pointer; }
    .mon-ver-datei { display:inline-block; font-size:11px; font-weight:600; color:var(--gray-600); background:var(--gray-100);
                border-radius:3px; padding:0 6px; margin-right:4px; }
    .mon-ver-was { display:block; margin-left:16px; color:var(--gray-600); font-size:12px; white-space:normal; }
    .mon-ver-v dl { margin:8px 0; }
    .mon-ver-v[open] { box-shadow:var(--shadow-sm); }
    /* Ansicht-Leiste */
    .mon-ansicht { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
    .mon-ansicht .mon-reset { height:32px; font-size:12px; }
    .mon-ansicht-tipp { font-size:12px; color:var(--gray-500); margin-left:4px; }
    #mon-vollbild { margin-left:auto; }
    .mon-seg { display:inline-flex; border:1px solid var(--gray-300); border-radius:8px; overflow:hidden; background:#fff; }
    .mon-seg button { height:30px; padding:0 12px; border:none; border-right:1px solid var(--gray-200); background:#fff;
                font-size:12px; color:var(--gray-600); cursor:pointer; }
    .mon-seg button:last-child { border-right:none; }
    .mon-seg button[aria-pressed="true"] { background:var(--primary); color:#fff; font-weight:600; }
    /* Vollbild */
    .mon-tabelle.vollbild { position:fixed; inset:0; z-index:950; background:var(--gray-50, #f8fafc); padding:14px 18px;
                display:flex; flex-direction:column; }
    .mon-tabelle.vollbild .mon-table-wrap { flex:1 1 auto; max-height:none; min-height:0; }
    body.mon-vollbild-an { overflow:hidden; }
    .mon-datei { display:inline-block; margin:0 4px 4px 0; padding:1px 6px; font-size:11px; font-weight:600; border-radius:3px;
                background:var(--gray-100); color:var(--primary); text-decoration:none; white-space:nowrap; }
    .mon-datei:hover { background:var(--primary); color:#fff; }
    td .bh-btn { white-space:nowrap; }
    .mon-nachoben { position:absolute; right:22px; bottom:18px; z-index:5; width:38px; height:38px; border-radius:50%;
                border:1px solid var(--gray-300); background:#fff; color:var(--primary); font-size:18px; cursor:pointer;
                box-shadow:0 4px 12px rgba(0,0,0,.15); }
    .mon-tabelle.vollbild .mon-nachoben { right:34px; bottom:30px; }
    @media (max-width:700px) { .mon-ansicht-tipp { display:none; } .mon-table-wrap { max-height:calc(100vh - 110px); } }
    .mon-err { color:var(--danger); max-width:220px; }
    table.mon-table td.mon-mehr { text-align:center; padding:14px; background:#fff; }
    .mon-mehr button { height:34px; padding:0 16px; border:1px solid var(--gray-300); background:var(--gray-50);
                border-radius:8px; font-size:13px; color:var(--primary); font-weight:600; cursor:pointer; }
    .mon-mehr button:hover { background:var(--gray-100); }
    .mon-mehr span { margin-left:10px; font-size:12px; color:var(--gray-500); }

    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
    /* Abzeichen bleiben in ihrer Spalte, zu lange werden mit … gekürzt (voller Text im Tooltip) */
    table.mon-table td .pill { max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; }
    .mon-hint { font-size:11px; color:var(--gray-600,#6b7280); margin-top:3px; max-width:100%; line-height:1.3; }
    .pill-werk   { background:var(--primary-light); color:var(--primary-dark); }
    .pill-in     { background:#dbeafe; color:#1e40af; }
    .pill-out    { background:#d1fae5; color:#065f46; }
    .pill-status { background:var(--gray-100); color:var(--gray-700); }
    .pill-ok     { background:#d1fae5; color:#065f46; }
    .pill-warn   { background:#fef3c7; color:#92400e; }
    .pill-bad    { background:#fee2e2; color:#991b1b; }

    .mon-setup { display:none; }
    .mon-setup-card { background:#fff; border:1px solid var(--gray-200); border-radius:var(--border-radius);
                padding:36px; text-align:center; box-shadow:var(--shadow-sm); max-width:560px; margin:24px auto; }
    .mon-setup-card h3 { margin:12px 0 6px; color:var(--gray-800); }
    .mon-setup-card p  { color:var(--gray-500); font-size:14px; }

    /* 800k-Umsatzgrenze (js/umsatzgrenze.js) */
    .ug-btn, .ug-badge { display:inline-block; margin-top:4px; font-size:11px; font-weight:600; border-radius:4px;
                padding:2px 7px; cursor:pointer; font-family:inherit; line-height:1.4; text-align:left; }
    .ug-btn { border:1px solid var(--primary); background:#fff; color:var(--primary); }
    .ug-btn:hover { background:var(--primary); color:#fff; }
    .ug-badge { border:1px solid transparent; }
    .ug-badge.ug-bis   { background:#e3f5e9; color:#0a6b2e; }
    .ug-badge.ug-ueber { background:#e8f0fb; color:#134080; }
    .ug-badge.ug-nicht { background:#ffe6cc; color:#8a3b00; }
    .ug-badge.ug-klein { background:var(--gray-100); color:var(--gray-600); cursor:default; }
    button.ug-badge:hover { border-color:currentColor; }

    #ug-dialog, #bh-dialog, #sp-dialog { margin:auto; border:none; border-radius:12px; padding:0; width:min(680px, calc(100vw - 32px));
                max-height:calc(100vh - 48px); box-shadow:0 20px 50px rgba(0,0,0,.25); }
    #ug-dialog::backdrop, #bh-dialog::backdrop, #sp-dialog::backdrop { background:rgba(17,24,39,.45); }
    .ug-form { padding:20px 22px; display:flex; flex-direction:column; gap:12px; }
    .ug-kopf { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .ug-kopf h3 { margin:0; font-size:17px; color:var(--gray-900); }
    .ug-x { border:none; background:none; font-size:16px; color:var(--gray-500); cursor:pointer; padding:2px 6px; }
    .ug-regel { margin:0; font-size:13px; color:var(--gray-700); background:var(--gray-50); border-left:3px solid var(--primary);
                padding:8px 10px; border-radius:4px; }
    .ug-felder { display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
    .ug-felder label, .ug-lbl { display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:var(--gray-600); }
    .ug-felder input, .ug-lbl input, .ug-lbl textarea { font:inherit; font-size:13px; font-weight:400; color:var(--gray-900);
                border:1px solid var(--gray-300); border-radius:6px; padding:7px 9px; width:100%; }
    .ug-lbl textarea { resize:vertical; line-height:1.45; }
    .ug-felder input:focus, .ug-lbl input:focus, .ug-lbl textarea:focus { outline:none; border-color:var(--primary);
                box-shadow:0 0 0 3px rgba(23,80,158,.12); }
    .ug-wahl { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .ug-opt { display:flex; flex-direction:column; gap:3px; text-align:left; padding:11px 13px; border:2px solid var(--gray-200);
                border-radius:8px; background:#fff; cursor:pointer; font:inherit; }
    .ug-opt strong { font-size:14px; color:var(--gray-900); }
    .ug-opt span { font-size:12px; color:var(--gray-500); }
    .ug-opt:hover { border-color:var(--gray-400); }
    .ug-opt.an { border-color:var(--primary); background:var(--primary-light); }
    .ug-bisher { margin:0; font-size:12px; color:var(--gray-600); }
    .ug-folge { margin:0; font-size:13px; font-weight:600; }
    .ug-folge:empty { display:none; }
    .ug-folge.ok { color:#0a6b2e; }
    .ug-folge.nicht { color:#8a3b00; }
    .ug-hinweis { margin:0; font-size:12px; color:var(--gray-500); }
    .ug-gelesen { margin:0; font-size:12px; color:var(--gray-600); }
    .ug-mailstand { margin:-6px 0 0; font-size:12px; color:var(--gray-500); }
    .ug-mails { margin:0; padding-left:18px; font-size:12px; color:var(--gray-600); }
    .ug-mails li.ok { color:#0a6b2e; }
    .ug-mails li.nicht { color:var(--danger); }
    .ug-badge.ug-mail-ok { background:#e3f5e9; color:#0a6b2e; cursor:default; }
    .ug-badge.ug-mail-wartet { background:var(--gray-100); color:var(--gray-700); cursor:default; }
    .ug-badge.ug-mail-fehler { background:#ffe0e0; color:#b40000; cursor:default; }
    .ug-gelesen:empty { display:none; }
    .ug-gelesen.ok { color:#0a6b2e; font-weight:600; }
    .ug-meldung { margin:0; font-size:13px; min-height:1px; }
    .ug-meldung:empty { display:none; }
    .ug-meldung.ok { color:#0a6b2e; }
    .ug-meldung.nicht { color:var(--danger); }
    .ug-aktionen { display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
    .ug-aktionen button { height:36px; padding:0 14px; border-radius:8px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
    .ug-aktionen button:disabled { opacity:.45; cursor:not-allowed; }
    .ug-sek { border:1px solid var(--gray-300); background:#fff; color:var(--gray-700); }
    .ug-prim { border:1px solid var(--primary); background:var(--primary); color:#fff; }
    @media (max-width:600px) { .ug-felder, .ug-wahl { grid-template-columns:1fr; } }

    /* Bearbeitung durch die Buchhaltung (js/bearbeitung.js) */
    .bh-btn { display:block; margin:0 0 6px; padding:3px 8px; font-size:11px; font-weight:600; border-radius:4px;
              border:1px solid var(--primary); background:#fff; color:var(--primary); cursor:pointer; }
    .bh-btn:hover { background:var(--primary); color:#fff; }
    .bh-varial { margin-top:2px; font-size:11px; color:var(--gray-600); }
    .bh-pill { display:inline-block; margin:3px 3px 0 0; font-size:11px; font-weight:600; border-radius:3px; padding:1px 6px; }
    .bh-pill.bh-ja { background:#e3f5e9; color:#0a6b2e; }
    .bh-pill.bh-nein { background:#ffe0e0; color:#b40000; }
    .bh-pill.bh-wartet { background:#fff3d6; color:#8a5a00; }
    .bh-pill.bh-neutral { background:var(--gray-100); color:var(--gray-700); }
    .bh-raster { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; align-items:end; }
    .bh-raster.bh-abas { grid-template-columns:2fr 1fr; }
    .bh-raster.bh-kopfdaten { grid-template-columns:1fr 2fr; }
    .ug-lbl select { font:inherit; font-size:13px; font-weight:400; color:var(--gray-900); padding:8px 10px;
              border:1px solid var(--gray-300); border-radius:8px; background:#fff; }
    .bh-check { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--gray-700); cursor:pointer; padding:8px 0; }
    .bh-check input { width:16px; height:16px; }
    .bh-box { display:flex; flex-direction:column; gap:8px; padding:12px 14px; background:var(--gray-50);
              border:1px solid var(--gray-200); border-radius:8px; }
    .bh-stand { margin:0; font-size:13px; color:var(--gray-700); }
    #bh-anf { display:flex; flex-direction:column; gap:10px; }
    .bh-such { position:relative; }
    .bh-such > label { font-size:12px; font-weight:600; color:var(--gray-600); }
    .bh-such > input { font:inherit; font-size:13px; font-weight:400; color:var(--gray-900); padding:8px 10px;
              border:1px solid var(--gray-300); border-radius:8px; }
    .bh-such > input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(23,80,158,.12); }

<script>
onAuthReady(async () => {
  initAdminNav();
  monInitFilterEvents();
  // Werkzuweisung aus den Einstellungen (einstellungen.html): Wer Werken zugewiesen
  // ist, sieht nur diese. Admins und Benutzer ohne Zuweisung sehen alle Werke, die
  // SharePoint sie lesen lässt.
  try { await loadRuntimeAccessConfig(); } catch (e) { /* Standard greift */ }
  // Das zugewiesene Werk ist beim Öffnen vorgewählt (bei mehreren das erste der Liste)
  const zugewiesen = getCurrentUserAccess();
  const standardWerk = (WERKE_ALLE.map(w => w[0]).find(c => zugewiesen.includes(c.toLowerCase()))
    || (zugewiesen[0] || '')).toUpperCase();
  loadMonitoring(isCurrentUserAdmin() ? [] : zugewiesen, { standardWerk });
});
</script>
